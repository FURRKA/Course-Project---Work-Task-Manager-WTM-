version: '3.9'
networks:
  default:
    driver: bridge

services:
  db:
    image: postgres
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    networks:
      - default

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: project_manager
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - CONNECTION_STRING=Host=db;Port=5438;Database=WTM;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
    networks:
    - default

volumes:
  pgdata: